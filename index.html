<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <title>My Earth Toy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="globe"></canvas>

    <div id="loading">
      <div class="spinner">🌍</div>
      <p data-i18n="loading"></p>
    </div>

    <header class="title">
      <h1>My Earth Toy</h1>
      <p data-i18n="subtitle"></p>
    </header>

    <div id="found-badge" class="badge">⭐ <span data-i18n="found"></span> <b id="found-count">0</b></div>

    <section id="sheet" class="sheet hidden" aria-live="polite">
      <button id="sheet-close" class="sheet-close" aria-label="close">✕</button>
      <div class="sheet-head">
        <span id="sheet-icon" class="sheet-icon"></span>
        <div>
          <div id="sheet-title" class="sheet-title"></div>
          <div id="sheet-sub" class="sheet-sub"></div>
        </div>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <nav class="controls">
      <button id="btn-zoom-in" aria-label="zoom in">＋</button>
      <button id="btn-zoom-out" aria-label="zoom out">－</button>
      <button id="btn-spin" aria-label="spin">🔄</button>
      <button id="btn-home" aria-label="home">🏠</button>
    </nav>

    <select id="lang" aria-label="language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
    </select>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
